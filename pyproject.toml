[project]
name = "slotcourse"
version = "0.1.0"
description = "Course-built Slot-BERT ablation ladder for unsupervised object segmentation on MOVi-A (ESE 4020)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slotcourse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
